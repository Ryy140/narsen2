name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # Ambil kode game lengkap (termasuk engine cocos2d-x) dari repo aslinya
      - name: Ambil kode sumber
        run: git clone --depth 1 https://github.com/real-re/NarutoSenki-V2.git src

      # SDK dipasang dulu dengan Java bawaan runner (sdkmanager butuh Java baru)
      - name: Pasang paket Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-31" "build-tools;31.0.0" "platform-tools"

      - name: Pasang NDK r21e
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e

      # Proyek ini memakai Gradle 5.6.4 dan AGP 3.3.3, jadi butuh Java 8
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build APK debug
        working-directory: src/projects/NarutoSenki/proj.android-studio
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=${{ steps.ndk.outputs.ndk-path }}" >> local.properties
          chmod +x gradlew
          ./gradlew :narutosenki:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: NarutoSenki-apk
          path: src/projects/NarutoSenki/proj.android-studio/app/build/outputs/apk/debug/*.apk
